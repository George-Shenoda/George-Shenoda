appId: com.georgeshenoda.portfolio
productName: George Shenoda
directories:
  output: apps/desktop/release
files:
  - apps/desktop/electron/**/*
  - apps/desktop/package.json
extraResources:
  - from: apps/web/.next/standalone
    to: standalone
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Development
npmRebuild: false
