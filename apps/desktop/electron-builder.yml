appId: com.georgeshenoda.portfolio
productName: George Shenoda
directories:
  output: release
files:
  - electron/**/*
  - package.json
extraResources:
  - from: ../web/.next/standalone
    to: standalone
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Development
